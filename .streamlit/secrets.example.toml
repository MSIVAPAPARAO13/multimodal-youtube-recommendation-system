# Streamlit Cloud Secrets Configuration Template
# Copy or enter these in your Streamlit Cloud app settings under "Secrets"

# Optional: Remote PostgreSQL + pgvector connection string (Neon / Supabase / AWS RDS)
# DATABASE_URL = "postgresql://postgres:password@your-db-host:5432/video_recommender"

# Optional: FastAPI backend URL if deployed separately (e.g. Railway / Render / AWS ECS)
# FASTAPI_URL = "https://your-api-domain.com"

# Optional: YouTube Data API key for live enrichment
# YOUTUBE_API_KEY = "your-api-key"
